name: Publish npm Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish from (for manual reruns)
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Derive release version
        run: |
          set -euo pipefail
          RAW_TAG="${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}"
          RELEASE_VERSION="${RAW_TAG#v}"
          if [[ -z "${RELEASE_VERSION}" ]]; then
            echo "Could not derive release version"
            exit 1
          fi
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> "$GITHUB_ENV"

      - name: Sync release version in repository files
        run: |
          set -euo pipefail
          sed -i -E "0,/^version = \"[^\"]+\"/s//version = \"${RELEASE_VERSION}\"/" src-tauri/Cargo.toml
          perl -0777 -i -pe 's/(name = "twokey-ai"\nversion = ")[^"]+("\n)/$1.$ENV{"RELEASE_VERSION"}.$2/ge' src-tauri/Cargo.lock
          node <<'EOF'
          const fs = require("fs");
          const version = process.env.RELEASE_VERSION;
          const packageJsonPath = "package.json";
          const tauriConfPath = "src-tauri/tauri.conf.json";

          const packageJson = JSON.parse(fs.readFileSync(packageJsonPath, "utf8"));
          packageJson.version = version;
          fs.writeFileSync(packageJsonPath, `${JSON.stringify(packageJson, null, 2)}\n`);

          const tauriConf = JSON.parse(fs.readFileSync(tauriConfPath, "utf8"));
          tauriConf.version = version;
          fs.writeFileSync(tauriConfPath, `${JSON.stringify(tauriConf, null, 2)}\n`);
          EOF

      - name: Commit synced version files
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json; then
            echo "No version changes required"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          git commit -m "chore: sync release versions ${RELEASE_VERSION}"
          git push

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Publish package
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
