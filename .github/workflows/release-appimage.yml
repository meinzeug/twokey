name: Build And Upload AppImage

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload the AppImage to (for manual reruns)
        required: true
        type: string

jobs:
  appimage:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Derive release version
        run: |
          set -euo pipefail
          RAW_TAG="${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}"
          RELEASE_VERSION="${RAW_TAG#v}"
          if [[ -z "${RELEASE_VERSION}" ]]; then
            echo "Could not derive release version"
            exit 1
          fi
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> "$GITHUB_ENV"

      - name: Sync release version in repository files
        run: |
          set -euo pipefail
          sed -i -E "0,/^version = \"[^\"]+\"/s//version = \"${RELEASE_VERSION}\"/" src-tauri/Cargo.toml
          perl -0777 -i -pe 's/(name = "twokey-ai"\nversion = ")[^"]+("\n)/$1.$ENV{"RELEASE_VERSION"}.$2/ge' src-tauri/Cargo.lock
          node <<'EOF'
          const fs = require("fs");
          const version = process.env.RELEASE_VERSION;
          const packageJsonPath = "package.json";
          const tauriConfPath = "src-tauri/tauri.conf.json";

          const packageJson = JSON.parse(fs.readFileSync(packageJsonPath, "utf8"));
          packageJson.version = version;
          fs.writeFileSync(packageJsonPath, `${JSON.stringify(packageJson, null, 2)}\n`);

          const tauriConf = JSON.parse(fs.readFileSync(tauriConfPath, "utf8"));
          tauriConf.version = version;
          fs.writeFileSync(tauriConfPath, `${JSON.stringify(tauriConf, null, 2)}\n`);
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Build AppImage bundle
        run: npm run tauri:build -- --bundles appimage

      - name: Prepare release asset
        run: |
          set -euo pipefail
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -type f -name '*.AppImage' | head -n 1)
          if [[ -z "${APPIMAGE}" ]]; then
            echo "AppImage build artifact not found"
            exit 1
          fi
          APPIMAGE_ASSET="twokey-linux-amd64-${RELEASE_VERSION}.AppImage"
          cp "${APPIMAGE}" "${APPIMAGE_ASSET}"
          sha256sum "${APPIMAGE_ASSET}" > "${APPIMAGE_ASSET}.sha256"
          echo "APPIMAGE_ASSET=${APPIMAGE_ASSET}" >> "$GITHUB_ENV"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.8.1

      - name: Sign AppImage and checksum (keyless)
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --output-signature "${APPIMAGE_ASSET}.sig" \
            --output-certificate "${APPIMAGE_ASSET}.pem" \
            "${APPIMAGE_ASSET}"

          cosign sign-blob --yes \
            --output-signature "${APPIMAGE_ASSET}.sha256.sig" \
            --output-certificate "${APPIMAGE_ASSET}.sha256.pem" \
            "${APPIMAGE_ASSET}.sha256"

      - name: Upload AppImage to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          files: |
            ${{ env.APPIMAGE_ASSET }}
            ${{ env.APPIMAGE_ASSET }}.sha256
            ${{ env.APPIMAGE_ASSET }}.sig
            ${{ env.APPIMAGE_ASSET }}.pem
            ${{ env.APPIMAGE_ASSET }}.sha256.sig
            ${{ env.APPIMAGE_ASSET }}.sha256.pem
          fail_on_unmatched_files: true
