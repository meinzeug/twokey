name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps for Tauri compile checks
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build package layer
        run: npm run build:package

      - name: Cargo check backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

  runtime-e2e-matrix:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        session: [x11, wayland]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps for runtime smoke tests
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Run runtime E2E smoke tests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml runtime_e2e -- --nocapture
        env:
          TWOKEY_E2E_SESSION: ${{ matrix.session }}

      - name: Run toolchain interaction E2E tests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --test toolchain_interaction_e2e -- --nocapture
